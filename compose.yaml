services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: encev_pulse_dev
      POSTGRES_USER: encev_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the local .env file}
      TZ: UTC
    command: ["postgres", "-c", "timezone=UTC"]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - db-local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  db-local:
    name: encev_pulse_db_local
    driver: bridge
    internal: false

volumes:
  pgdata:
    name: encev_pulse_pgdata
