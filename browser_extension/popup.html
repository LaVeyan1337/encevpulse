<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ENCEV PULSE e-ÇED</title><link rel="stylesheet" href="popup.css"></head>
<body><main class="popup">
  <header><span class="mark">P</span><div><strong>ENCEV PULSE</strong><small>e-ÇED sekme izleyicisi</small></div><span class="connection" id="connection">Kontrol</span></header>
  <section class="site"><span class="eyebrow">ETKİN SEKME</span><strong id="pageTitle">Sekme okunuyor…</strong><small id="pageOrigin"></small><button id="enableSite" class="secondary">Bu portalı izlemeye aç</button></section>
  <section class="form">
    <label>Görünür hesap etiketi<input id="accountName" maxlength="100" placeholder="Örn. kurum e-ÇED hesabı"></label>
    <label>Oturum durumu<select id="sessionState"><option value="unknown">Doğrulanmadı / emin değilim</option><option value="active">Oturum açık (kendim kontrol ettim)</option><option value="logged_out">Oturum kapalı (kendim kontrol ettim)</option></select></label>
    <label>Portal bölümü (isteğe bağlı)<input id="sectionLabel" maxlength="60" placeholder="Örn. Proje başvuru listesi"></label>
    <button id="save" class="primary">Seçimlerimi kaydet ve sinyal gönder</button>
    <p class="hint" id="status" role="status" aria-live="polite">Hesap etiketi ve oturum durumu yalnızca sizin açıkça seçtiğiniz değerlerden alınır.</p>
  </section>
  <footer><a href="options.html" target="_blank">Bağlantı ayarları</a><span>Parola / çerez okunmaz</span></footer>
</main><script src="popup.js"></script></body></html>
