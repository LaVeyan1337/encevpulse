services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in the root .env file}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in the root .env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      TZ: UTC
    command: ["postgres", "-c", "timezone=UTC"]
    ports:
      # Host-only binding. Never change this to 0.0.0.0 or a LAN IP.
      - "127.0.0.1:5432:5432"
    volumes:
      - encev_pulse_prod_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U encev_pulse_app -d encev_pulse"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  # Deliberately separate from the local development pgdata volume.
  encev_pulse_prod_pgdata:
    name: encev_pulse_prod_pgdata
